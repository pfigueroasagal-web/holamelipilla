name: Verificación mensual de información

on:
  # Corre el día 1 de cada mes a las 08:00 hora Chile (11:00 UTC)
  schedule:
    - cron: '0 11 1 * *'

  # También se puede ejecutar manualmente desde GitHub
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo de la ejecución manual'
        required: false
        default: 'Verificación manual'

# Permite que el GITHUB_TOKEN integrado pueda hacer commit/push de los cambios,
# sin depender de un secret personalizado (GH_TOKEN) que no está configurado.
permissions:
  contents: write

jobs:
  verificar-y-actualizar:
    name: Verificar información del sitio
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Ejecutar el script de verificación
      # A prueba de fallos: si el script falla, se registra pero NO se marca error.
      - name: Ejecutar verificación de información
        run: |
          echo "🤖 Iniciando verificación mensual..."
          python update_info.py || echo "⚠️ La verificación falló esta vez; se reintentará el próximo mes."
          echo "✅ Verificación completada"

      # 4. Configurar identidad de git para el commit
      - name: Configurar git
        run: |
          git config user.name "HolaMelipilla Bot"
          git config user.email "bot@holamelipilla.cl"

      # 5. Hacer commit si hay cambios
      # A prueba de fallos: cualquier problema se registra pero no marca error.
      - name: Commit de cambios
        run: |
          git add index.html verificacion_info.json || true
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos para commitear."
          else
            FECHA=$(date '+%d/%m/%Y')
            git commit -m "🤖 Verificación automática mensual — $FECHA" || true
            git push || echo "⚠️ No se pudo subir el cambio esta vez; se reintentará el próximo mes."
            echo "✅ Cambios procesados"
          fi

      # 6. Mostrar resumen en el log del workflow
      - name: Mostrar reporte
        run: |
          echo "📄 Reporte de verificación:"
          cat verificacion_info.json || echo "(sin reporte disponible)"

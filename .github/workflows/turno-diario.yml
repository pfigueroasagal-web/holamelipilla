name: Actualizar turno de farmacia

# Genera turno.json a diario para que la portada cargue el turno al instante,
# sin depender de proxies CORS lentos en el navegador.
# Corre varias veces al día por si el turno cambia (el rol suele rotar en la mañana).
on:
  schedule:
    - cron: '30 11 * * *'   # ~07:30–08:30 Chile
    - cron: '30 13 * * *'   # ~09:30–10:30 Chile (turno ya publicado)
    - cron: '30 20 * * *'   # ~16:30–17:30 Chile (respaldo)
  # Se ejecuta solo al fusionar a main: así el turno.json se genera de inmediato
  # tras el merge, sin pasos manuales. Ignora sus propios commits para no repetirse.
  push:
    branches: [main]
    paths-ignore:
      - 'turno.json'
  workflow_dispatch:

# Permite que el GITHUB_TOKEN integrado pueda hacer commit/push del turno.json,
# sin depender de un secret personalizado (GH_TOKEN) que no está configurado.
permissions:
  contents: write

jobs:
  actualizar-turno:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A prueba de fallos: si el script falla (MINSAL caído, sin datos, etc.)
      # se registra en el log pero NO se marca error, para no enviar correos de fallo.
      - name: Generar turno.json
        run: python actualizar_turno.py || echo "⚠️ No se pudo generar el turno esta vez; se reintentará en la próxima ejecución."

      - name: Configurar git
        run: |
          git config user.name "HolaMelipilla Bot"
          git config user.email "bot@holamelipilla.cl"

      # A prueba de fallos: cualquier problema al commitear/pushear se registra
      # pero no marca error, para que el workflow siempre termine en verde.
      - name: Commit si hay cambios
        run: |
          git add turno.json || true
          if git diff --staged --quiet; then
            echo "Sin cambios en el turno."
          else
            git commit -m "🤖 Turno de farmacia actualizado — $(date '+%d/%m/%Y %H:%M')" || true
            git push || echo "⚠️ No se pudo subir el cambio esta vez; se reintentará en la próxima ejecución."
          fi
